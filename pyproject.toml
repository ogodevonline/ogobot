[project]
name = "ogobot"
version = "0.1.0"
description = "S.E.A.C. - Self-Evolving AI Core on Pydantic AI + Telegram"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-ai>=0.1.0",
    "pydantic-graph>=0.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiogram>=3.3.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    "logfire>=0.20.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# Configuration specific to uv can go here

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.10",
    "pyright>=1.1.350",
    "debugpy>=1.8.20",
    "commitizen>=4.13.10",
]
